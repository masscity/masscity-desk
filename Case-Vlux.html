<title>Andri · Lighting Kungfu — Project</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@500;600;700&family=Fraunces:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html { scroll-behavior: smooth; }
  html, body, #root { margin: 0; min-height: 100vh; background: linear-gradient(180deg, oklch(0.96 0.025 75) 0%, oklch(0.92 0.04 65) 100%); color: oklch(0.28 0.04 50); font-family: "Quicksand", "Nunito", system-ui, sans-serif; transition: background 0.4s, color 0.4s; }
  html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root { background: linear-gradient(180deg, oklch(0.22 0.025 50) 0%, oklch(0.16 0.03 45) 100%); color: oklch(0.94 0.02 80); }
  * { box-sizing: border-box; }
  body { overflow-x: hidden; }
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .glass-hover { transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.25s, background 0.25s, box-shadow 0.35s; transform-style: preserve-3d; will-change: transform; }
  .glass-hover:hover { transform: translateY(-4px) scale(1.005); box-shadow: 0 32px 60px -20px rgba(40,25,10,0.45), inset 0 1px 0 rgba(255,255,255,0.7); }
  .glass::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), rgba(255,250,230,0.25), transparent 60%); opacity: 0; transition: opacity 0.3s; border-radius: inherit; }
  .glass:hover::before { opacity: 1; }
  ::selection { background: oklch(0.72 0.16 45 / 0.35); color: oklch(0.28 0.04 50); }
  .hero-parallax { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .hero-parallax__bg { position: absolute; inset: -60px; will-change: transform; }
  .hero-parallax__content { position: relative; z-index: 2; }
  .timeline-line { position: absolute; left: 39px; top: 0; bottom: 0; width: 3px; background: rgba(110, 75, 45, 0.15); border-radius: 2px; overflow: hidden; }
  .timeline-line__fill { position: absolute; top: 0; left: 0; width: 100%; background: oklch(0.72 0.16 45); border-radius: 2px; transform-origin: top; }
  .timeline-dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid oklch(0.72 0.16 45); background: oklch(0.96 0.025 75); position: relative; z-index: 2; transition: background 0.3s, transform 0.3s; }
  .timeline-dot.active { background: oklch(0.72 0.16 45); transform: scale(1.2); }
  html[data-theme="dark"] .timeline-line { background: rgba(255, 235, 200, 0.12); }
  html[data-theme="dark"] .timeline-dot { background: oklch(0.22 0.025 50); border-color: oklch(0.78 0.16 50); }
  html[data-theme="dark"] .timeline-dot.active { background: oklch(0.78 0.16 50); }
  html[data-theme="dark"] .timeline-line__fill { background: oklch(0.78 0.16 50); }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .gallery-grid > :first-child { grid-column: 1 / 3; grid-row: 1 / 3; }
  .gallery-item { position: relative; border-radius: 18px; overflow: hidden; border: 2px solid rgba(110, 75, 45, 0.28); aspect-ratio: 16/10; cursor: pointer; }
  .gallery-item:first-child { aspect-ratio: auto; }
  .gallery-item__img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(.2,.8,.2,1); }
  .gallery-item:hover .gallery-item__img { transform: scale(1.04); }
  .gallery-item__label { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 16px; background: linear-gradient(transparent, rgba(20,15,8,0.75)); }
  .stat-block { text-align: left; }
  .stat-block__value { font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .stat-block__label { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 10px; }
  .hud-mono { font-family: "JetBrains Mono", monospace; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }
  @keyframes mote { 0%,100% { transform: translateY(0) translateX(0); opacity: 0.4; } 50% { transform: translateY(-30px) translateX(15px); opacity: 0.9; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes draw-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: oklch(0.88 0.03 75); }
  ::-webkit-scrollbar-thumb { background: oklch(0.72 0.16 45); border-radius: 999px; border: 2px solid oklch(0.88 0.03 75); }
  html[data-theme="dark"] ::-webkit-scrollbar-track { background: oklch(0.22 0.025 50); }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: oklch(0.78 0.16 50); border-color: oklch(0.22 0.025 50); }
  .prose p { font-family: "Plus Jakarta Sans", "Quicksand", system-ui, sans-serif; font-size: 16.5px; line-height: 1.75; font-weight: 500; margin: 0 0 18px; }
  .prose h3 { font-family: "DM Serif Display", "Fraunces", Georgia, serif; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 28px 0 14px; }
  .prose strong { font-weight: 700; }
  .prose ul { padding-left: 0; list-style: none; margin: 0 0 18px; }
  .prose li { font-family: "Plus Jakarta Sans", "Quicksand", system-ui, sans-serif; font-size: 15.5px; line-height: 1.65; font-weight: 500; margin: 0 0 10px; padding-left: 28px; position: relative; }
  .prose li::before { content: '▸'; position: absolute; left: 0; top: 0; font-weight: 800; color: oklch(0.72 0.16 45); font-size: 14px; }
  .section-divider { width: 60px; height: 3px; background: oklch(0.72 0.16 45); border-radius: 2px; margin: 0 0 40px; opacity: 0.5; }
  @keyframes scroll-drift { 0%,100% { transform: translateY(0); opacity: 0.7; } 50% { transform: translateY(10px); opacity: 1; } }
  .scroll-hint { animation: scroll-drift 2.8s cubic-bezier(.4,0,.2,1) infinite; }
</style>
