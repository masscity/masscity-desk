<script>
  if (new URLSearchParams(location.search).has("embed")) {
    document.documentElement.classList.add("embed-mode");
    try { localStorage.setItem('resume-theme', 'light'); } catch(e) {}

    // 1. Keep body/html transparent even after React sets inline style
    function clearBg() {
      document.documentElement.style.background = "transparent";
      document.body.style.background = "transparent";
    }
    clearBg();
    new MutationObserver(clearBg).observe(document.body, {
      attributes: true, attributeFilter: ["style"]
    });

    // 2. Remove the inner SiteTopBar (<header>) the moment React mounts it
    function removeTopbar(root) {
      root.querySelectorAll("header").forEach(el => el.remove());
    }
    const domObserver = new MutationObserver(() => {
      removeTopbar(document);
    });
    document.addEventListener("DOMContentLoaded", function() {
      removeTopbar(document);
      domObserver.observe(document.body, { childList: true, subtree: true });
    });
  }
</script>

function MetaStrip(){const ref=useReveal();const facts=[['Client',PROJECT.client],['Role',PROJECT.role],['Team',PROJECT.team],['Timeline',PROJECT.period],['Platform',PROJECT.platform]];return<div ref={ref} className="reveal" style={{marginBottom:40}}><WindowCard padding={0}><div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',borderTop:`2px solid ${RT.glassBorder}`}}>{facts.map(([k,v],i)=><div key={k} style={{padding:'18px 20px',borderRight:i<4?`1.5px solid ${RT.glassBorder}`:'none'}}><div style={{fontFamily:RT.fontUI,fontSize:10.5,fontWeight:700,color:RT.ink3,textTransform:'uppercase',letterSpacing:1}}>{k}</div><div style={{marginTop:6,fontFamily:RT.fontDisplay,fontSize:15,fontWeight:600,color:RT.ink,lineHeight:1.25}}>{v}</div></div>)}</div></WindowCard></div>;}

function Problem(){const ref=useReveal();return<section ref={ref} className="reveal" style={{marginBottom:60}}><SectionHead id="problem" kicker="01 · the problem" title={"Social apps on mobile feel flat. The \"place\" is the missing ingredient."}/><div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:26,marginTop:8}}><div className="prose" dangerouslySetInnerHTML={{__html:`<p>Techpolitan's research showed that users wanted persistent spaces — rooms that felt like theirs — not feeds, not threads, not channels. The closest existing product was Gather.town, which is desktop-only and browser-dependent. The ask: a mobile-first social space that feels like a place, not a timeline.</p><p><strong>Voxel avatars were the solution to the hardest design problem: how do you give a user a sense of self in a space without a face camera?</strong></p>`}}/><div className="glass" style={{padding:24,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(20px) saturate(140%)',WebkitBackdropFilter:'blur(20px) saturate(140%)'}}><Kicker>constraints</Kicker><ul className="prose" style={{marginTop:12}}><li style={{fontFamily:RT.fontUI,fontSize:15,lineHeight:1.6,fontWeight:500,margin:'0 0 10px',paddingLeft:24,position:'relative'}}>Runs smoothly on mid-range Android — no PC required</li><li style={{fontFamily:RT.fontUI,fontSize:15,lineHeight:1.6,fontWeight:500,margin:'0 0 10px',paddingLeft:24,position:'relative'}}>Voxel avatar builder: 200+ combinations on device</li><li style={{fontFamily:RT.fontUI,fontSize:15,lineHeight:1.6,fontWeight:500,margin:'0 0 10px',paddingLeft:24,position:'relative'}}>Persistent rooms: stays alive even when owner is offline</li><li style={{fontFamily:RT.fontUI,fontSize:15,lineHeight:1.6,fontWeight:500,margin:'0 0 10px',paddingLeft:24,position:'relative'}}>In-engine UI toolkit — no generic component library</li><li style={{fontFamily:RT.fontUI,fontSize:15,lineHeight:1.6,fontWeight:500,margin:'0 0 10px',paddingLeft:24,position:'relative'}}>Launch target: 1k DAU in the first quarter</li></ul></div></div></section>;}

const STEPS = [{"n":"01","label":"Social mechanics research","body":"Studied Discord, Gather, Roblox, and WeChat for social primitives. Identified three that mattered: persistent identity, a place to hang out, and low-friction joining. Everything else is noise."},{"n":"02","label":"Voxel system design","body":"Designed the avatar builder as a constraint-based system: fixed grid, limited palette, maximum expressiveness. 200+ combinations from 18 components. Built entirely in the game engine for consistent rendering."},{"n":"03","label":"Room architecture","body":"Rooms are 12×12 voxel grids. Users can place furniture, pin links, and set ambient audio. The room persists without the owner — you can visit a friend's room when they're offline."},{"n":"04","label":"In-engine UI toolkit","body":"Standard mobile UI components don't render well inside a 3D engine. Built 22 custom UI components that match the voxel aesthetic and render at 60fps on mid-range devices."},{"n":"05","label":"Soft launch + iteration","body":"Launched to 200 internal users at Techpolitan. Three major iterations over 6 weeks — simplified the room editor, added room search, and fixed avatar rendering on low-end devices before public launch."}];
function Process(){const ref=useReveal();return<section ref={ref} className="reveal" style={{marginBottom:60}}><SectionHead id="process" kicker="02 · process" title="Five steps from the brief to the build."/><div style={{display:'flex',flexDirection:'column',gap:14}}>{STEPS.map((s,i)=><div key={s.n} className="glass glass-hover" style={{position:'relative',display:'grid',gridTemplateColumns:'80px 1fr',gap:22,padding:'22px 26px',background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(18px) saturate(140%)',WebkitBackdropFilter:'blur(18px) saturate(140%)',boxShadow:'0 14px 28px -14px rgba(40,25,10,0.30)'}}><div style={{display:'flex',flexDirection:'column',alignItems:'flex-start'}}><div style={{fontFamily:RT.fontDisplay,fontSize:38,fontWeight:700,color:RT.accent,lineHeight:1,letterSpacing:-1}}>{s.n}</div>{i<STEPS.length-1&&<div style={{width:2,flex:1,marginTop:10,marginLeft:18,background:RT.glassBorderHi,opacity:0.5}}/>}</div><div><h3 style={{margin:0,fontFamily:RT.fontDisplay,fontSize:22,fontWeight:700,color:RT.ink,letterSpacing:-0.5}}>{s.label}</h3><p style={{margin:'8px 0 0',fontFamily:RT.fontUI,fontSize:15,fontWeight:500,lineHeight:1.6,color:RT.ink2}}>{s.body}</p></div></div>)}</div></section>;}

const FEATURES = [{"tag":"For users","title":"Voxel avatar builder.","body":"200+ combinations from 18 components. Build your identity in under 2 minutes. The constraint is the feature — everyone is recognizably a person."},{"tag":"For communities","title":"Persistent rooms.","body":"Your room stays alive when you leave. Friends can visit, leave notes, and hang out in your space without you. The place outlasts the session."},{"tag":"For the engine","title":"Custom UI toolkit.","body":"22 components built inside the engine. Consistent with the voxel aesthetic, render at 60fps on mid-range Android, and handle touch input at game-engine precision."}];
function Solution(){const ref=useReveal();return<section ref={ref} className="reveal" style={{marginBottom:60}}><SectionHead id="solution" kicker="03 · solution" title={"A place that feels like yours. On a phone. At 60fps."}/><div className="glass" style={{marginBottom:22,position:'relative',background:`linear-gradient(135deg, oklch(0.62 0.16 45), oklch(0.38 0.13 45))`,border:`2px solid ${RT.glassBorder}`,borderRadius:22,aspectRatio:'21 / 10',overflow:'hidden',boxShadow:'0 24px 50px -22px rgba(40,25,10,0.50)'}}><div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 30% 30%,rgba(255,255,255,0.25),transparent 55%),radial-gradient(circle at 70% 75%,rgba(0,0,0,0.18),transparent 55%)'}}/><div style={{position:'absolute',inset:0,display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,padding:32}}>{["Avatar","Room","Social"].map((label,i)=><div key={label} style={{background:'rgba(255,250,235,0.90)',border:`2.5px solid ${RT.ink}`,borderRadius:14,boxShadow:'0 14px 28px -10px rgba(0,0,0,0.35)',display:'flex',flexDirection:'column',overflow:'hidden'}}><div style={{padding:'8px 12px',borderBottom:`1.5px solid ${RT.glassBorder}`,fontFamily:'"JetBrains Mono",monospace',fontSize:10.5,fontWeight:600,color:RT.ink2,letterSpacing:0.8,textTransform:'uppercase'}}>0{i+1} · {label}</div><div style={{flex:1,background:`linear-gradient(180deg,oklch(0.82 0.06 ${200-i*25}),oklch(0.58 0.09 ${190-i*25}))`,position:'relative'}}><div style={{position:'absolute',bottom:10,left:10,fontFamily:'"JetBrains Mono",monospace',fontSize:9,fontWeight:600,color:'rgba(255,255,255,0.80)',letterSpacing:0.5}}>panel</div></div></div>)}</div></div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>{FEATURES.map((f,i)=><div key={f.title} className="glass glass-hover" style={{padding:22,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(18px) saturate(140%)',WebkitBackdropFilter:'blur(18px) saturate(140%)',boxShadow:'0 14px 28px -14px rgba(40,25,10,0.30)'}}><div style={{display:'inline-block',padding:'4px 10px',borderRadius:999,background:[RT.green,RT.yellow,RT.pink][i],border:`1.5px solid ${RT.ink}`,fontFamily:RT.fontUI,fontSize:10.5,fontWeight:800,color:RT.ink,letterSpacing:0.6,textTransform:'uppercase'}}>{f.tag}</div><h3 style={{margin:'12px 0 0',fontFamily:RT.fontDisplay,fontSize:22,fontWeight:700,color:RT.ink,letterSpacing:-0.5,lineHeight:1.2}}>{f.title}</h3><p style={{margin:'10px 0 0',fontFamily:RT.fontUI,fontSize:14,fontWeight:500,lineHeight:1.6,color:RT.ink2}}>{f.body}</p></div>)}</div></section>;}

function Outcome(){const ref=useReveal();const accentMap={RT_accent:RT.accent,'RT.accent':RT.accent,'RT.green':RT.green,'RT.yellow':RT.yellow};return<section ref={ref} className="reveal" style={{marginBottom:60}}><SectionHead id="outcome" kicker="04 · outcome" title={"Twelve thousand monthly sessions. The room became the product."}/><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:24}}>{STATS.map((s,i)=><div key={s.label} className="glass" style={{padding:26,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(18px) saturate(140%)',WebkitBackdropFilter:'blur(18px) saturate(140%)'}}><div style={{fontFamily:RT.fontDisplay,fontSize:56,fontWeight:700,color:[RT.accent,RT.green,RT.yellow][i],lineHeight:1,letterSpacing:-2}}>{s.val}</div><div style={{marginTop:10,fontFamily:RT.fontUI,fontSize:12.5,fontWeight:700,color:RT.ink2,letterSpacing:0.4,textTransform:'uppercase'}}>{s.label}</div></div>)}</div><div className="glass" style={{padding:32,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:22,backdropFilter:'blur(18px) saturate(140%)',WebkitBackdropFilter:'blur(18px) saturate(140%)',borderLeft:`5px solid ${RT.accent}`}}><Kicker>quote</Kicker><blockquote style={{margin:'14px 0 0',fontFamily:RT.fontDisplay,fontSize:24,fontWeight:600,fontStyle:'italic',color:RT.ink,lineHeight:1.45,letterSpacing:-0.4,maxWidth:760}}>"I check my room every morning before I check my messages. That surprised me."</blockquote><div style={{marginTop:18,fontFamily:RT.fontUI,fontSize:12,fontWeight:700,color:RT.ink3,letterSpacing:0.5,textTransform:'uppercase'}}>— Internal user, Techpolitan beta</div></div></section>;}

function Reflection(){const ref=useReveal();return<section ref={ref} className="reveal" style={{marginBottom:60}}><SectionHead id="reflection" kicker="05 · reflection" title="What I'd do differently."/><div className="prose" style={{maxWidth:720}} dangerouslySetInnerHTML={{__html:`<p>The voxel constraint was the best design decision on the project and the hardest to defend internally. Everyone wanted more customization options. The data was clear: users who finished the avatar builder in under 90 seconds had 3× better retention than those who took longer. The constraint kept them in the flow state.</p><p>The in-engine UI toolkit was slower to build than a generic library would have been, and worth every day. When the UI feels like part of the world, users stop noticing the seam between game and app.</p><p>What I'd change: the room editor. It's functional but not delightful. The next version needs a direct-manipulation editor, not the current menu-based system. That's the gap between "users build rooms" and "users design spaces".</p>`}}/></section>;}

function OnThisPage(){const[active,setActive]=useState('overview');useEffect(()=>{const io=new IntersectionObserver(entries=>{const vis=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(vis[0])setActive(vis[0].target.id);},{rootMargin:'-30% 0px -55% 0px'});SECTIONS.forEach(s=>{const el=document.getElementById(s.id);if(el)io.observe(el);});return()=>io.disconnect();},[]);return<aside style={{position:'sticky',top:110,alignSelf:'start'}}><div className="glass" style={{padding:18,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(20px) saturate(140%)',WebkitBackdropFilter:'blur(20px) saturate(140%)'}}><Kicker>on this page</Kicker><nav style={{marginTop:12,display:'flex',flexDirection:'column',gap:2}}>{SECTIONS.map(s=><a key={s.id} href={`#${s.id}`} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,background:active===s.id?RT.innerFill:'transparent',color:active===s.id?RT.ink:RT.ink2,fontFamily:RT.fontUI,fontSize:13,fontWeight:active===s.id?700:500,textDecoration:'none',transition:'background 0.2s,color 0.2s'}}><span style={{width:6,height:6,borderRadius:'50%',background:active===s.id?RT.accent:RT.glassBorderHi}}/>{s.label}</a>)}</nav></div><div className="glass" style={{marginTop:12,padding:18,background:RT.glassFill,border:`2px solid ${RT.glassBorder}`,borderRadius:18,backdropFilter:'blur(20px) saturate(140%)',WebkitBackdropFilter:'blur(20px) saturate(140%)'}}><Kicker>share</Kicker><div style={{marginTop:12,display:'flex',flexDirection:'column',gap:8}}><a href="Resume.html" style={{display:'flex',justifyContent:'space-between',padding:'10px 12px',borderRadius:10,background:RT.innerFill,border:`1.5px solid ${RT.glassBorder}`,textDecoration:'none',fontFamily:RT.fontUI,fontSize:12.5,fontWeight:600,color:RT.ink}}><span>Read the resume</span><span>↗</span></a><a href="Portfolio.html" style={{display:'flex',justifyContent:'space-between',padding:'10px 12px',borderRadius:10,background:RT.innerFill,border:`1.5px solid ${RT.glassBorder}`,textDecoration:'none',fontFamily:RT.fontUI,fontSize:12.5,fontWeight:600,color:RT.ink}}><span>All projects</span><span>↗</span></a></div></div></aside>;}
