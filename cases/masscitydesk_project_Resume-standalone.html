function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {

}

function TweakRow({ label, value, children, inline = false }) {
  return (

}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

function TweakToggle({ label, value, onChange }) {

function TweakSelect({ label, value, options, onChange }) {

const RT = { ...RT_LIGHT };

function applyTheme(mode) {
  const src = mode === 'dark' ? RT_DARK : RT_LIGHT;
  Object.keys(src).forEach(k => { RT[k] = src[k]; });
  document.documentElement.dataset.theme = mode;
  document.body.style.background = `linear-gradient(180deg, ${src.bg0} 0%, ${src.bg1} 100%)`;
  document.body.style.color = src.ink;
}

const { useEffect, useRef, useState } = React;

function useReveal(delay = 0) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    // Pre-set the CSS transition-delay so the visual animation starts after `delay` ms
    if (delay) el.style.transitionDelay = delay + 'ms';
    const fallback = setTimeout(() => el.classList.add('in'), 700 + delay);
    const io = new IntersectionObserver(
      (entries) => entries.forEach((x) => {
        if (x.isIntersecting || x.intersectionRatio > 0) {
          clearTimeout(fallback);
          x.target.classList.add('in');
          io.unobserve(x.target);
        }
      }),
      { threshold: 0.05, rootMargin: '0px 0px -10% 0px' }
    );
    io.observe(el);
    return () => { clearTimeout(fallback); io.disconnect(); };
  }, []);
  return ref;
}

function Magnetic({ children, strength = 0.3, style = {}, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      el.style.transform = `translate(${(e.clientX - cx) * strength}px, ${(e.clientY - cy) * strength}px)`;
    };
    const reset = () => { el.style.transform = ''; };
    const parent = el.parentElement;
    parent.addEventListener('mousemove', onMove); parent.addEventListener('mouseleave', reset);
    return () => { parent.removeEventListener('mousemove', onMove); parent.removeEventListener('mouseleave', reset); };
  }, [strength]);
  return <span ref={ref} style={{ display: 'inline-block', transition: 'transform 0.25s cubic-bezier(.2,.8,.2,1)', ...style }} {...rest}>{children}</span>;
}

function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const jakarta = new Date(now.getTime() + (now.getTimezoneOffset() + 420) * 60000);
  const hh = String(jakarta.getHours()).padStart(2, '0');
  const mm = String(jakarta.getMinutes()).padStart(2, '0');
  return (
    <span style={{ fontFamily: RT.fontUI, fontSize: 13, fontWeight: 600, color: RT.ink, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
      <span style={{ width: 8, height: 8, borderRadius: '50%', background: RT.green, boxShadow: '0 0 10px ' + RT.green }} />
      Jakarta · {hh}:{mm}
    </span>
  );
}

function CursorSpotlight() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const move = (e) => { el.style.setProperty('--sx', e.clientX + 'px'); el.style.setProperty('--sy', e.clientY + 'px'); };
    window.addEventListener('mousemove', move);
    return () => window.removeEventListener('mousemove', move);
  }, []);
  return <div ref={ref} style={{
    position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1,
    background: `radial-gradient(420px circle at var(--sx,50%) var(--sy,50%), oklch(0.95 0.10 90 / 0.18), transparent 60%)`,
  }} />;
}

function Kicker({ children, style = {} }) {
  return <span style={{ fontFamily: RT.fontUI, fontSize: 12, fontWeight: 700, color: RT.accentDeep, letterSpacing: 1.2, textTransform: 'uppercase', ...style }}>{children}</span>;
}

function useTheme() {
  const [mode, setMode] = useState(() => {
    try { return localStorage.getItem('resume-theme') || 'light'; } catch { return 'light'; }
  });
  applyTheme(mode);
  useEffect(() => {
    try { localStorage.setItem('resume-theme', mode); } catch {}
  }, [mode]);
  const toggle = () => setMode(m => m === 'light' ? 'dark' : 'light');
  return [mode, toggle];
}

function ResumeApp() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS_V2);
  const [theme, toggleTheme] = useTheme();
  const fontDisplay = FONT_STACKS_V2[t.displayFont] || FONT_STACKS_V2["Fraunces"];
  const fontUI = BODY_STACKS_V2[t.bodyFont] || BODY_STACKS_V2.Jakarta;
  return (
    <div style={{ minHeight: '100vh', position: 'relative' }}>
      {t.showRoomBackdrop && theme === 'light' && <ResumeRoom theme={theme} />}
      {theme === 'dark' && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
          <div style={{ position: 'absolute', top: '-15%', right: '-10%', width: 700, height: 700, borderRadius: '50%', background: `radial-gradient(circle, ${RT.accent} 0%, transparent 65%)`, opacity: 0.18, filter: 'blur(40px)' }} />
          <div style={{ position: 'absolute', bottom: '-20%', left: '-15%', width: 600, height: 600, borderRadius: '50%', background: `radial-gradient(circle, ${RT.yellow} 0%, transparent 65%)`, opacity: 0.10, filter: 'blur(40px)' }} />
        </div>
      )}
      <CursorSpotlight />
      <div style={{ position: 'relative', zIndex: 2 }}>
        <TopBar fontUI={fontUI} theme={theme} toggleTheme={toggleTheme} />
        <main className="rsp-main-resume" style={{ maxWidth: t.panelWidth, margin: '0 auto', padding: '110px 24px 60px', display: 'grid', gridTemplateColumns: '300px 1fr', gap: 18, alignItems: 'start' }}>
          <Sidebar fontDisplay={fontDisplay} fontUI={fontUI} />
          <div style={{ alignSelf: 'start' }}>
            <Hero fontDisplay={fontDisplay} fontUI={fontUI} />
            <CaseStudies fontDisplay={fontDisplay} fontUI={fontUI} />
            <Experience fontDisplay={fontDisplay} fontUI={fontUI} />
            <HowIWork fontDisplay={fontDisplay} fontUI={fontUI} />
            <Contact fontDisplay={fontDisplay} fontUI={fontUI} />
            <footer style={{ marginTop: 30, padding: '18px 6px', display: 'flex', justifyContent: 'space-between', fontFamily: fontUI, fontWeight: 600, fontSize: 11.5, color: RT.ink2 }}>
              <span>© 2026 Andri Saputro</span>
              <span>resume · cozy edition</span>
            </footer>
          </div>
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Typography" />
        <TweakSelect label="Display font" value={t.displayFont}
          options={['Recoleta','DM Serif','Caprasimo','Sniglet','Fraunces']}
          onChange={(v) => setTweak('displayFont', v)} />
        <TweakSelect label="Body font" value={t.bodyFont}
          options={['Quicksand','Nunito','Jakarta']}
          onChange={(v) => setTweak('bodyFont', v)} />
        <TweakSection label="Layout" />
        <TweakSlider label="Page width" value={t.panelWidth} min={900} max={1280} step={20} unit="px"
          onChange={(v) => setTweak('panelWidth', v)} />
        <TweakToggle label="Show room backdrop" value={t.showRoomBackdrop}
          onChange={(v) => setTweak('showRoomBackdrop', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ResumeApp />);
</script>
</body>
