function applyTheme(mode) {
  const src = mode === 'dark' ? RT_DARK : RT_LIGHT;
  Object.keys(src).forEach(k => { RT[k] = src[k]; });
  document.documentElement.dataset.theme = mode;
  document.body.style.background = `linear-gradient(180deg, ${src.bg0} 0%, ${src.bg1} 100%)`;
  document.body.style.color = src.ink;
}

const { useEffect, useRef, useState, useMemo } = React;

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const fallback = setTimeout(() => el.classList.add('in'), 600);
    const io = new IntersectionObserver(
      (entries) => entries.forEach((x) => {
        if (x.isIntersecting || x.intersectionRatio > 0) {
          x.target.classList.add('in');
          io.unobserve(x.target);
        }
      }),
      { threshold: 0.05, rootMargin: '0px 0px -10% 0px' }
    );
    io.observe(el);
    return () => { clearTimeout(fallback); io.disconnect(); };
  }, []);
  return ref;
}

function Magnetic({ children, strength = 0.3, style = {}, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      el.style.transform = `translate(${(e.clientX - cx) * strength}px, ${(e.clientY - cy) * strength}px)`;
    };
    const reset = () => { el.style.transform = ''; };
    const parent = el.parentElement;
    parent.addEventListener('mousemove', onMove); parent.addEventListener('mouseleave', reset);
    return () => { parent.removeEventListener('mousemove', onMove); parent.removeEventListener('mouseleave', reset); };
  }, [strength]);
  return <span ref={ref} style={{ display: 'inline-block', transition: 'transform 0.25s cubic-bezier(.2,.8,.2,1)', ...style }} {...rest}>{children}</span>;
}

function LiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  const jakarta = new Date(now.getTime() + (now.getTimezoneOffset() + 420) * 60000);
  const hh = String(jakarta.getHours()).padStart(2, '0');
  const mm = String(jakarta.getMinutes()).padStart(2, '0');
  return (
    <span style={{ fontFamily: RT.fontUI, fontSize: 13, fontWeight: 600, color: RT.ink, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
      <span style={{ width: 8, height: 8, borderRadius: '50%', background: RT.green, boxShadow: '0 0 10px ' + RT.green }} />
      Jakarta · {hh}:{mm}
    </span>
  );
}

function CursorSpotlight() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const move = (e) => { el.style.setProperty('--sx', e.clientX + 'px'); el.style.setProperty('--sy', e.clientY + 'px'); };
    window.addEventListener('mousemove', move);
    return () => window.removeEventListener('mousemove', move);
  }, []);
  return <div ref={ref} style={{
    position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1,
    background: `radial-gradient(420px circle at var(--sx,50%) var(--sy,50%), oklch(0.95 0.10 90 / 0.18), transparent 60%)`,
  }} />;
}

function useTheme() {
  const [mode, setMode] = useState(() => {
    try { return localStorage.getItem('resume-theme') || 'light'; } catch { return 'light'; }
  });
  applyTheme(mode);
  useEffect(() => {
    try { localStorage.setItem('resume-theme', mode); } catch {}
  }, [mode]);
  const toggle = () => setMode(m => m === 'light' ? 'dark' : 'light');
  return [mode, toggle];
}

const ROLE_TAGS = ['All', 'Lead', 'Product', 'UI/UX', '3D', 'Game'];

function projectMatchesRole(p, tag) {
  if (tag === 'All') return true;
  const blob = (p.role + ' ' + (p.discipline || []).join(' ')).toLowerCase();
  if (tag === 'Lead')    return /\blead\b|founder/.test(blob);
  if (tag === 'Product') return /\bproduct\b|saas|tooling/.test(blob);
  if (tag === 'UI/UX')   return /\bui\/ux|\bux\b|design system|web/.test(blob);
  if (tag === '3D')      return /\b3d\b|ue5|vr|metaverse|simulation/.test(blob);
  if (tag === 'Game')    return /\bgame\b|telegram|metaverse|vr/.test(blob);
  return false;
}

function ProjectList({ items, activeIdx, onSelect, roleFilter, onRoleFilter, fontDisplay, fontUI }) {

      boxShadow: '0 18px 36px -16px rgba(40,25,10,0.30), inset 0 1px 0 rgba(255,255,255,0.5)',
    }}>
      <nav style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>

          const isActive = i === activeIdx;
          return (

function ProjectHeader({ p, fontDisplay }) {

function ProjectHero({ p, fontDisplay }) {
  const [visible, setVisible] = useState(true);
  const prevSlug = useRef(p.slug);

  useEffect(() => {
    if (prevSlug.current !== p.slug) {
      setVisible(false);
      const t = setTimeout(() => { prevSlug.current = p.slug; setVisible(true); }, 180);
      return () => clearTimeout(t);
    }
  }, [p.slug]);

  return (
    <div className="glass" style={{
      gridColumn: 2, gridRow: 2, alignSelf: 'stretch', position: 'relative', minHeight: 0,
      background: `linear-gradient(135deg, ${p.cover} 0%, ${p.coverDeep} 100%)`,
      border: `2px solid ${RT.glassBorder}`, borderRadius: 18, overflow: 'hidden',
      boxShadow: '0 22px 44px -20px rgba(40,25,10,0.45)',
    }}>
      <div style={{
        position: 'absolute', inset: 0,
        opacity: visible ? 1 : 0, transform: visible ? 'scale(1)' : 'scale(1.02)',
        transition: 'opacity 0.35s cubic-bezier(.2,.8,.2,1), transform 0.35s cubic-bezier(.2,.8,.2,1)',
      }}>
        {p.heroImg ? (
          <img src={p.heroImg} alt={p.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
        ) : (
          <>
            <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.32), transparent 55%), radial-gradient(circle at 75% 75%, rgba(0,0,0,0.20), transparent 55%)' }} />
            <div style={{
              position: 'absolute', inset: '15% 20%',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              background: 'rgba(255,250,235,0.92)', border: `2.5px solid ${RT.ink}`,
              borderRadius: 14, boxShadow: '0 16px 32px -10px rgba(0,0,0,0.35)',
              fontFamily: fontDisplay, fontSize: 'clamp(60px, 9vw, 110px)', fontWeight: 700, color: p.coverDeep, letterSpacing: -3,
            }}>
              {p.title.split(' ').map(w => w[0]).join('').slice(0, 2)}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function PortfolioApp() {
  const [theme, toggleTheme] = useTheme();
  const fontDisplay = '"Fraunces", Georgia, serif';
  const fontUI = '"Plus Jakarta Sans", system-ui, sans-serif';

  const [roleFilter, setRoleFilter] = useState('All');
  const items = useMemo(() => PORTFOLIO_PROJECTS.filter(p => projectMatchesRole(p, roleFilter)), [roleFilter]);
  const [activeIdx, setActiveIdx] = useState(0);

  useEffect(() => { if (activeIdx >= items.length) setActiveIdx(0); }, [items.length, activeIdx]);

  useEffect(() => {
    function syncHash() {
      const h = (window.location.hash || '').replace('#', '');
      if (!h) return;
      if (h === 'others') { window.parent.postMessage({ type: 'openSorryModal' }, '*'); return; }
      const i = items.findIndex(p => p.slug === h);
      if (i >= 0) setActiveIdx(i);
    }
    syncHash();
    window.addEventListener('hashchange', syncHash);
    return () => window.removeEventListener('hashchange', syncHash);
  }, [items]);

  const active = items[activeIdx] || items[0];

  return (
    <div style={{ minHeight: '100vh', position: 'relative' }}>
      {theme === 'light' ? <SiteRoom theme={theme} /> : <DarkAmbient />}
      <CursorSpotlight />
      <div style={{ position: 'relative', zIndex: 2 }}>
        <SiteTopBar fontUI={fontUI} theme={theme} toggleTheme={toggleTheme} current="Work" />

        <main className="rsp-main" style={{ maxWidth: 1280, margin: '0 auto', padding: '80px 32px 24px', height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxSizing: 'border-box' }}>
          <header style={{ marginBottom: 28 }}>
            <h1 style={{ margin: 0, fontFamily: fontDisplay, fontSize: 'clamp(36px, 4.4vw, 56px)', fontWeight: 700, color: RT.ink, letterSpacing: -1.5, lineHeight: 1.05 }}>
              Selected work, <span style={{ color: RT.accent, fontStyle: 'italic' }}>one rail at a time</span>.
            </h1>
            <p style={{ margin: '12px 0 0', fontFamily: fontUI, fontSize: 14.5, fontWeight: 500, color: RT.ink2, maxWidth: 640 }}>
              Pick a project — the details open here.
            </p>
          </header>

          <div className="rsp-body-cols" style={{ display: 'grid', gridTemplateColumns: '240px 1fr 200px', gridTemplateRows: 'minmax(120px, auto) 1fr', gap: 24, alignItems: 'start', flex: 1, minHeight: 0 }}>
            <ProjectList
              items={items}
              activeIdx={activeIdx}
              onSelect={setActiveIdx}
              roleFilter={roleFilter}
              onRoleFilter={setRoleFilter}
              fontDisplay={fontDisplay}
              fontUI={fontUI}
            />
            {active && (
              <React.Fragment>
                <ProjectHeader key={active.slug + '-hdr'} p={active} fontDisplay={fontDisplay} />
                <ProjectHero p={active} fontDisplay={fontDisplay} />
                <InfoPanel key={active.slug + '-info'} p={active} fontDisplay={fontDisplay} fontUI={fontUI} />
              </React.Fragment>
            )}
          </div>

        </main>
      </div>
    </div>
  );
}
